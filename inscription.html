<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Lien vers les icônes pour les utiliser -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Lien pour faire les action de l'utilisateur avec JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"

<body class="bg-beige">

    <!-- Pour le header -->
    <header class="d-flex justify-content-start align-items-center p-2 bg-vert">

        <!-- Logo du site -->
        <img class="taille-logo" src="/img/Logo_site_3.png" alt="Logo_site_3.png">

        <!-- Barre de navigation -->
        <nav class="navbar navbar-expand-lg fs-5">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"

                    <span class="navbar-toggler-icon"></span>

                <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                    <div class="navbar-nav">
                        <a class="nav-link ms-5 mx-5" href="index.html">Accueil</a>
                        <a class="nav-link ms-5 mx-5" href="confirmation.html">Connexion</a>
                        <a class="nav-link ms-5 mx-5" href="inscription.html">Inscription</a>

                        <a class="nav-link ms-5 mx-5" href="apropos.html">A propos</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <h1 class="text-noir text-center mt-3">Inscription</h1>

        <!-- Formulaire d'inscription au club de tir de compétition -->
        <form class="d-grid" action="compte-cree.html">

            <div class="container">
                <div class="row">
                    <div class="col">
                        <!-- Pour le prénom -->
                        <label class="taille-label text-noir m-4 text-left" for="prenom">Prénom : </label>
                        <input class="taille-input text-left bg-bleu-pluie" name="prenom" type="text" id="prenom">
                    </div>
                    <div class="col">
                        <!-- Pour le nom -->
                        <label class="taille-label text-noir m-4 text-left" for="nom">Nom : </label>
                        <input class="taille-input text-left bg-bleu-pluie" name="nom" type="tel" id="nom">
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <!-- Pour le mail -->
                        <label class="taille-label text-noir m-4 text-left" for="email">Adresse e-mail : </label>
                        <input class="taille-input text-left bg-bleu-pluie" name="email" type="email" id="email">
                    </div>
                    <div class="col">
                        <!-- Pour le téléphone -->
                        <label class="taille-label text-noir m-4 text-left" for="telephone">Téléphone : </label>
                        <input class="taille-input text-left bg-bleu-pluie" name="telephone" type="tel" id="telephone">
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <!-- Pour l'adresse -->
                        <label class="taille-label text-noir m-4 text-left" for="adresse">Adresse : </label>
                        <input class="taille-input text-left bg-bleu-pluie" name="adresse" type="text" id="adresse">
                    </div>
                    <div class="col">
                        <!-- Pour le mot de passe -->
                        <label class="taille-label text-noir m-4 text-left" for="mdp">Mot de passe : </label>
                        <input class="taille-input text-left bg-bleu-pluie" name="mdp" type="password" id="mdp">
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <!-- Pour le select -->
                        <label class="taille-label text-noir m-4 text-left" for="select">Comment avez-vous connu le site
                            :
                        </label>
                        <select class="taille-input text-left bg-bleu-pluie" name="select" aria-label="select"
                            id="select">
                            <option selected>3 choix possibles</option>
                            <option value="1">One</option>
                            <option value="2">Two</option>
                            <option value="3">Three</option>
                        </select>
                    </div>
                    <div class="col">
                        <!-- Pour le mot de passe -->
                        <label class="taille-label text-noir m-4" for="confirm-mdp">Confirmer le mot de passe : </label>
                        <input class="taille-input text-left bg-bleu-pluie" name="confirm-mdp" type="password"
                            id="confirm-mdp">
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <!-- Pour les boutons radio -->
                        <label class="taille-label text-noir m-4" for="confirm-mdp">Préférence de communication :
                        </label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="radioDefault1" id="radioDefault1">
                            <label class="form-check-label" for="radioDefault1">
                                SMS
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="radioDefault2" id="radioDefault2">
                            <label class="form-check-label" for="radioDefault2">
                                Mail
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="radioDefault3" id="radioDefault3">
                            <label class="form-check-label" for="radioDefault3">
                                Je ne veux pas
                            </label>
                        </div>
                    </div>
                    <div class="col">
                        <!-- Pour la checkbox -->
                        <label class="taille-label text-noir m-4 text-left" for="select">J'ai lu, j'ai tout compris
                        </label>
                        <input type="checkbox" name="checkbox" id="checkbox">
                    </div>
                </div>
            </div>
        </form>
    </main>

    <!-- Pour le footer -->
    <footer class="footer mt-5 p-2">
        <div class="container-fluid">
            <div class="row">
                <div class="col-4">
                    <p class="text-noir text-decoration-underline fs-5">Adresse : <span class="text-noir">25 Chemin du
                            Stand, 76600 Le
                            Havre</span>
                    </p>
                    <p class="text-noir text-decoration-underline fs-5">Téléphone : <span class="text-noir">01 23 45 67
                            89</span></p>
                    <p class="text-noir text-decoration-underline fs-5">E-Mail : <span
                            class="text-noir">contact@letirlegendaire.fr</span></p>
                </div>
                <div class="col-6 d-flex justify-content-center align-items-center">
                    <a class="text-decoration-none text-noir fs-5 ms-3 mx-3" href="url">Mentions Légales</a>
                    <a class="text-decoration-none text-noir fs-5 ms-3 mx-3" href="url">CGV</a>
                    <a class="text-decoration-none text-noir fs-5 ms-3 mx-3" href="url">Politique de confidentialité</a>
                </div>
                <div class="col d-flex justify-content-center align-items-center">
                    <a class="text-decoration-none text-noir fs-5 ms-3 mx-3" href="url"><i
                            class="bi bi-facebook fs-1"></i></a>
                    <a class="text-decoration-none text-noir fs-5 ms-3 mx-3" href="url"><i
                            class="bi bi-instagram fs-1"></i></a>
                    <a class="text-decoration-none text-noir fs-5 ms-3 mx-3" href="url"><i
                            class="bi bi-youtube fs-1"></i></a>
                </div>
            </div>
        </div>
    </footer>
</body>

</html>
