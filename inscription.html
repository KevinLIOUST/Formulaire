<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>

    <!-- Lien vers Bootstrap pour l'utiliser -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">

    <!-- Lien vers les icônes pour les utiliser -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Lien pour faire les action de l'utilisateur avec JavaScript -->

    <!-- Lien vers le fichier css pour le Web Design -->

<body class="bg-dark">

    <!-- Formulaire d'inscription au club de tir de compétition -->
    <form class="d-grid" action="compte-cree.html">

        <div class="container">
            <div class="row">
                <div class="col">
                    <!-- Pour le prénom -->
                    <label class="text-white m-5" for="prenom">Prénom : </label>
                    <input class="taille-input" type="text" id="prenom">
                </div>
                <div class="col">
                    <!-- Pour le nom -->
                    <label class="text-white m-5" for="telephone">Téléphone : </label>
                    <input class="taille-input" type="tel" id="telephone">
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <!-- Pour le mail -->
                    <label class="text-white m-5" for="email">Adresse e-mail : </label>
                    <input class="taille-input" type="email" id="email">
                </div>
                <div class="col">
                    <!-- Pour le téléphone -->
                    <label class="text-white m-5" for="telephone">Téléphone : </label>
                    <input class="taille-input" type="tel" id="telephone">
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <!-- Pour le mail -->
                    <label class="text-white m-5" for="email">Adresse e-mail : </label>
                    <input class="taille-input" type="email" id="email">
                </div>
                <div class="col">
                    <!-- Pour le téléphone -->
                    <label class="text-white m-5" for="telephone">Téléphone : </label>
                    <input class="taille-input" type="tel" id="telephone">
                </div>
            </div>
        </div>
    </form>
</body>

</html>
